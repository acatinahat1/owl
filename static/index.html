<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buddy's Virtual Tutorial</title>
    <!-- Flask serves everything in the ./static folder at /static/... -->
    <link rel="stylesheet" href="/static/style.css">
    <!-- Bangla font, so Bangla text looks good even on devices without one -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap">
    <style>
        /* Language toggle (can be moved into style.css) */
        .lang-toggle {
            margin-left: auto;
            display: inline-flex;
            border: 2px solid currentColor;
            border-radius: 999px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .lang-toggle button {
            font: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 0.35rem 0.9rem;
            border: 0;
            background: transparent;
            color: inherit;
            cursor: pointer;
        }

        .lang-toggle button[aria-pressed="true"] {
            background: #ffb703;
            color: #1d1d1d;
        }

        .lang-toggle button:focus-visible {
            outline: 3px solid #219ebc;
            outline-offset: -3px;
        }

        html[lang="bn"] body,
        html[lang="bn"] button,
        html[lang="bn"] input {
            font-family: "Noto Sans Bengali", system-ui, sans-serif;
        }
    </style>
</head>

<body>

    <header class="site-header">
        <span class="logo" aria-hidden="true">🦉</span>
        <div>
            <h1 data-i18n="title">Buddy's Virtual Tutorial</h1>
            <p class="tagline" data-i18n="tagline">Learning is fun! Pick a subject to start. ✨</p>
        </div>
        <div class="lang-toggle" role="group" data-i18n-aria-label="langGroup" aria-label="Choose language">
            <button type="button" data-lang="en" aria-pressed="true">English</button>
            <button type="button" data-lang="bn" aria-pressed="false" lang="bn">বাংলা</button>
        </div>
    </header>

    <!-- ================= Learning dashboard =================
       Four views live here. Only one has the "active" class at a time;
       showView() switches between them with a fade/slide (see style.css). -->
    <main id="dashboard">

        <!-- Homepage: grid of subjects -->
        <section id="view-home" class="view active" aria-labelledby="home-title">
            <h2 id="home-title" class="view-title" data-i18n="homeTitle">My Subjects</h2>
            <div id="subject-grid" class="card-grid"></div>
        </section>

        <!-- Chapter view: chapters of the chosen subject -->
        <section id="view-chapters" class="view" aria-labelledby="chapters-title">
            <button class="back-btn" data-back="home" data-i18n="backSubjects">⬅ Back to Subjects</button>
            <h2 id="chapters-title" class="view-title"></h2>
            <div id="chapter-list" class="list"></div>
        </section>

        <!-- Lesson view: lessons of the chosen chapter -->
        <section id="view-lessons" class="view" aria-labelledby="lessons-title">
            <button class="back-btn" data-back="chapters" data-i18n="backChapters">⬅ Back to Chapters</button>
            <h2 id="lessons-title" class="view-title"></h2>
            <div id="lesson-list" class="list"></div>
        </section>

        <!-- Reader: the lesson notes -->
        <section id="view-reader" class="view" aria-labelledby="reader-title">
            <button class="back-btn" data-back="lessons" data-i18n="backLessons">⬅ Back to Lessons</button>
            <article class="reader">
                <h2 id="reader-title"></h2>
                <div id="reader-body"></div>
                <p class="reader-tip" data-i18n="readerTip">🤔 Have a question about this lesson? Ask Buddy in the
                    corner!</p>
            </article>
        </section>
    </main>

    <!-- ================= Floating Buddy chat widget ================= -->
    <button id="chat-toggle" class="chat-toggle" aria-label="Open chat with Buddy" aria-expanded="false"
        aria-controls="chat-window">
        <span class="icon-open" aria-hidden="true">💬</span>
        <span class="icon-close" aria-hidden="true">✖</span>
    </button>

    <div id="chat-window" class="chat-window" role="dialog" aria-label="Chat with Buddy"
        data-i18n-aria-label="chatDialog" hidden>
        <div class="chat-header">
            <span class="chat-avatar" aria-hidden="true">🦉</span>
            <div>
                <strong data-i18n="buddyName">Buddy</strong>
                <small data-i18n="buddyRole">Your study helper</small>
            </div>
        </div>
        <div id="chat-messages" class="chat-messages" aria-live="polite"></div>
        <form id="chat-form" class="chat-form" autocomplete="off">
            <input id="chat-input" type="text" maxlength="500" placeholder="Type your question..."
                aria-label="Your question" data-i18n-placeholder="placeholder" data-i18n-aria-label="inputLabel">
            <button id="chat-send" type="submit" aria-label="Send" data-i18n-aria-label="send">➤</button>
        </form>
    </div>

                                    "Can you think of the opposite of 'fast'?"],
                                notes_bn: [
                                    "কিছু adjective-এর বিপরীত শব্দ আছে: big আর small, hot আর cold।",
                                    "'fast'-এর বিপরীত শব্দ কী, বলতে পারো?"]
                            },
                        ]
                    },
                ],
            },
        ];

        /* =====================================================================
           2. DASHBOARD NAVIGATION  (Home -> Chapters -> Lessons -> Reader)
           ===================================================================== */
        const state = { subject: null, chapter: null, lesson: null };

        function showView(name) {
            document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
            document.getElementById("view-" + name).classList.add("active");
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        // Small helper: build a clickable card/button with an emoji and a label.
        function makeButton(className, emoji, label, sub, onClick) {
            const btn = document.createElement("button");
            btn.className = className;
            btn.innerHTML = `<span class="item-emoji" aria-hidden="true"></span>
                   <span class="item-text"><span class="item-label"></span><span class="item-sub"></span></span>`;
            btn.querySelector(".item-emoji").textContent = emoji;
            btn.querySelector(".item-label").textContent = label;
            btn.querySelector(".item-sub").textContent = sub || "";
            btn.addEventListener("click", onClick);
            return btn;
        }

        function renderSubjects() {
            const grid = document.getElementById("subject-grid");
            grid.replaceChildren();   // safe to call again when the language changes
            SUBJECTS.forEach(subject => {
                const card = makeButton(`subject-card color-${subject.color}`, subject.emoji, L(subject, "name"),
                    t("chapters", subject.chapters.length), () => openSubject(subject));
                grid.appendChild(card);
            });
        }

        function openSubject(subject) {
            state.subject = subject;
            document.getElementById("chapters-title").textContent = `${subject.emoji} ${L(subject, "name")}`;
            const list = document.getElementById("chapter-list");
            list.replaceChildren();
            subject.chapters.forEach((chapter, i) => {
                const number = LANG === "bn" ? toBnDigits(i + 1) : String(i + 1);
                list.appendChild(makeButton(`list-item color-${subject.color}`, number, L(chapter, "name"),
                    t("lessons", chapter.lessons.length), () => openChapter(chapter)));
            });
            showView("chapters");
        }

        function openChapter(chapter) {
            state.chapter = chapter;
            document.getElementById("lessons-title").textContent = L(chapter, "name");
            const list = document.getElementById("lesson-list");
            list.replaceChildren();
            chapter.lessons.forEach(lesson => {
                list.appendChild(makeButton(`list-item color-${state.subject.color}`, "📝", L(lesson, "name"),
                    t("tapToRead"), () => openLesson(lesson)));
            });
            showView("lessons");
        }

        function openLesson(lesson) {
            state.lesson = lesson;
            document.getElementById("reader-title").textContent = L(lesson, "name");
            const body = document.getElementById("reader-body");
            body.replaceChildren();
            L(lesson, "notes").forEach(text => {
                const p = document.createElement("p");
                p.textContent = text;
                body.appendChild(p);
            });
            showView("reader");
        }

        document.querySelectorAll(".back-btn").forEach(btn =>
            btn.addEventListener("click", () => showView(btn.dataset.back)));

        renderSubjects();

        /* =====================================================================
           3. BUDDY CHAT WIDGET
           The browser keeps the chat history and sends all of it to Flask's
           POST /api/chat on every question. Flask adds the textbook chunks and
           calls Claude, then returns {"reply": "..."} or {"error": "..."}.
           ===================================================================== */
        const toggleBtn = document.getElementById("chat-toggle");
        const chatWindow = document.getElementById("chat-window");
        const messagesBox = document.getElementById("chat-messages");
        const form = document.getElementById("chat-form");
        const input = document.getElementById("chat-input");
        const sendBtn = document.getElementById("chat-send");

        const history = [];   // [{role: "user" | "assistant", content: "..."}] sent to the server

        // Open/close the chat box when the round icon is clicked.
        toggleBtn.addEventListener("click", () => {
            const opening = chatWindow.hidden;
            chatWindow.hidden = !opening;
            toggleBtn.classList.toggle("open", opening);
            toggleBtn.setAttribute("aria-expanded", String(opening));
            toggleBtn.setAttribute("aria-label", opening ? t("chatClose") : t("chatOpen"));
            if (opening) input.focus();
        });

        // Add a chat bubble. textContent (not innerHTML) keeps replies safe to display.
        function addBubble(role, text, extraClass) {
            const bubble = document.createElement("div");
            bubble.className = `bubble ${role}` + (extraClass ? " " + extraClass : "");
            bubble.textContent = text;
            messagesBox.appendChild(bubble);
            messagesBox.scrollTop = messagesBox.scrollHeight;   // auto-scroll to the newest message
            return bubble;
        }

        // The welcome message is shown, but not sent to Claude (clean_history drops a leading assistant turn anyway).
        // Kept in a variable so it can switch language too.
        const welcomeBubble = addBubble("assistant", t("welcome"));

        form.addEventListener("submit", async event => {
            event.preventDefault();
            const text = input.value.trim();
            if (!text) return;

            addBubble("user", text);
            history.push({ role: "user", content: text });
            input.value = "";
            input.disabled = sendBtn.disabled = true;

            const thinking = addBubble("assistant", t("thinking"), "thinking");

            try {
                const res = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ messages: history }),
                });
                const data = await res.json().catch(() => ({}));
                thinking.remove();
                if (res.ok && data.reply) {
                    addBubble("assistant", data.reply);
                    history.push({ role: "assistant", content: data.reply });
                } else {
                    // Don't keep a question Buddy couldn't answer, so the child can simply ask again.
                    history.pop();
                    addBubble("assistant", data.error || t("error"), "error");
                }
            } catch (err) {
                thinking.remove();
                history.pop();
                addBubble("assistant", t("offline"), "error");
            } finally {
                input.disabled = sendBtn.disabled = false;
                input.focus();
            }
        });

        /* =====================================================================
           4. LANGUAGE SWITCHER
           Swaps every data-i18n text, then re-fills the open screens in the new
           language and puts the child back on the screen they were looking at.
           Earlier chat messages stay as they were written.
           ===================================================================== */
        function applyLanguage(lang) {
            LANG = lang;
            try { localStorage.setItem("lang", lang); } catch (e) { }
            document.documentElement.lang = lang;
            document.title = t("title");

            document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
            document.querySelectorAll("[data-i18n-placeholder]").forEach(el =>
                el.setAttribute("placeholder", t(el.dataset.i18nPlaceholder)));
            document.querySelectorAll("[data-i18n-aria-label]").forEach(el =>
                el.setAttribute("aria-label", t(el.dataset.i18nAriaLabel)));
            toggleBtn.setAttribute("aria-label", chatWindow.hidden ? t("chatOpen") : t("chatClose"));
            welcomeBubble.textContent = t("welcome");

            document.querySelectorAll(".lang-toggle button").forEach(btn =>
                btn.setAttribute("aria-pressed", String(btn.dataset.lang === lang)));

            // Re-render with the existing functions, then return to the screen that was open.
            const active = document.querySelector(".view.active");
            renderSubjects();
            if (state.subject) openSubject(state.subject);
            if (state.chapter) openChapter(state.chapter);
            if (state.lesson) openLesson(state.lesson);
            document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v === active));
        }

        document.querySelectorAll(".lang-toggle button").forEach(btn =>
            btn.addEventListener("click", () => applyLanguage(btn.dataset.lang)));

        if (LANG !== "en") applyLanguage(LANG);
    </script>
</body>

</html>
